autoinstall:
  version: 1

  interactive-sections:
    - identity
    - storage

  locale: en_US.UTF-8
  keyboard:
    layout: us
    variant: altgr-intl
  timezone: Europe/Vienna

  codecs:
    install: true
  drivers:
    install: true

  late-commands:
    - install -m 755 /cdrom/first-login.sh /target/usr/local/bin/dotfiles-first-login
    - mkdir -p /target/etc/skel/.config
    - touch /target/etc/skel/.config/gnome-initial-setup-done
    - |
      curtin in-target -- sh -c 'for h in /home/*/; do
        u=$(stat -c %U "$h"); g=$(stat -c %G "$h")
        install -d -o "$u" -g "$g" "$h.config"
        install -m 644 -o "$u" -g "$g" /dev/null "$h.config/gnome-initial-setup-done"
      done'
    - |
      cat > /target/etc/xdg/autostart/dotfiles-setup.desktop <<EOF
      [Desktop Entry]
      Type=Application
      Name=Dotfiles setup
      Exec=ptyxis -- /usr/local/bin/dotfiles-first-login
      X-GNOME-Autostart-enabled=true
      EOF
